server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: true

# Redis Development
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}

# Development Logging
logging:
  level:
    root: INFO
    com.arsw.bomberdino: DEBUG
    com.arsw.bomberdino.config.LatencyInterceptor: INFO
    org.springframework.web.socket: TRACE
    org.springframework.messaging: TRACE
