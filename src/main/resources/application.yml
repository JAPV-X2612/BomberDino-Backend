server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bomberdino-backend

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

  # Task Execution (Async)
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 100
      thread-name-prefix: async-task-

  # Microsoft Entra ID Configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys

# Azure Credentials
azure:
  tenant-id: ${AZURE_TENANT_ID:fda6941b-6261-4982-9460-24a10346780b}
  client-id: ${AZURE_CLIENT_ID:990dc266-798b-4a1a-b8c4-0fe59148a1ae}

# Game Configuration
game:
  bomb:
    default-explosion-delay: 3000
    scheduler-pool-size: 10
  powerup:
    default-duration: 30000
    scheduler-pool-size: 5
  map:
    default-width: 12
    default-height: 12
  session:
    round-duration: 180
    max-players: 4

# WebSocket Configuration
websocket:
  broker-prefix: /topic
  app-prefix: /app
  endpoint: /ws
  allowed-origins: '*'

# Redis Configuration
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: 0
  timeout: 5000
  ssl: false
  pool:
    max-active: 20
    max-idle: 10
    min-idle: 5

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    com.arsw.bomberdino: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
